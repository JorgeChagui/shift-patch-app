name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # postinstall runs `prisma generate`; no database or secrets needed.
      - run: npm ci

      - run: npm run type-check

      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Local Supabase stack started below (ports from supabase/config.toml).
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:34322/shiftpatch_test
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:34322/shiftpatch_e2e
      JWT_SECRET: ci-only-jwt-secret-not-for-production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Postgres + Storage (behind Kong), the same stack as local dev. Everything else is off.
      - name: Start Supabase (db, storage, kong)
        run: npx supabase start -x gotrue,realtime,imgproxy,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Export Supabase Storage credentials
        run: |
          npx supabase status -o json > "$RUNNER_TEMP/supabase.json"
          node -e '
            const s = require(process.argv[1]);
            console.log("status keys:", Object.keys(s).join(", "));
            const key = s.SECRET_KEY || s.SERVICE_ROLE_KEY;
            if (!s.API_URL || !key) { console.error("Supabase status has no API_URL or secret key"); process.exit(1); }
            console.log(`::add-mask::${key}`);
            require("fs").appendFileSync(process.env.GITHUB_ENV, `SUPABASE_URL=${s.API_URL}\nSUPABASE_SECRET_KEY=${key}\n`);
          ' "$RUNNER_TEMP/supabase.json"

      # globalSetup creates, migrates and seeds shiftpatch_test.
      - run: npm run test:api

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # globalSetup migrates and seeds shiftpatch_e2e; the webServer builds and starts the app.
      - run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Scans the full git history for committed secrets.
      - name: gitleaks
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose
