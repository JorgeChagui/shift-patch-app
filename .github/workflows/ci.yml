name: CI

on:
  push:
  pull_request:

# Least privilege: every job only reads the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # postinstall runs `prisma generate`; no database or secrets needed.
      - run: npm ci

      - run: npm run type-check

      - run: npm run lint

      # Production dependencies only; dev tooling advisories are triaged (spec/tasks/README.md, decision 15).
      - run: npm run security:audit

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Local Supabase stack started below (ports from supabase/config.toml).
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:34322/shiftpatch_test
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:34322/shiftpatch_e2e
      JWT_SECRET: ci-only-jwt-secret-not-for-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Postgres + Storage (behind Kong), the same stack as local dev. Auth stays on: the CLI only
      # reports API keys when it runs. Everything else is off.
      - name: Start Supabase (db, storage, auth, kong)
        run: npx supabase start -x realtime,imgproxy,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Export Supabase Storage credentials
        run: |
          npx supabase status -o json > "$RUNNER_TEMP/supabase.json"
          node -e '
            const s = require(process.argv[1]);
            console.log(`::notice::supabase status keys: ${Object.keys(s).join(", ")}`);
            const key = s.SECRET_KEY || s.SERVICE_ROLE_KEY;
            if (!s.API_URL || !key) { console.error("Supabase status has no API_URL or secret key"); process.exit(1); }
            console.log(`::add-mask::${key}`);
            require("fs").appendFileSync(process.env.GITHUB_ENV, `SUPABASE_URL=${s.API_URL}\nSUPABASE_SECRET_KEY=${key}\n`);
          ' "$RUNNER_TEMP/supabase.json"

      # globalSetup creates, migrates and seeds shiftpatch_test.
      - run: npm run test:api

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # globalSetup migrates and seeds shiftpatch_e2e; the webServer builds and starts the app.
      - run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Scans the full git history for committed secrets.
      - name: gitleaks
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # OWASP Top 10 + TypeScript/React/Next.js/secrets rules; any finding fails the job.
      # Same scan as `npm run security:sast`.
      - name: semgrep
        run: >-
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.179.0
          semgrep scan --error --metrics=off
          --config p/owasp-top-ten --config p/typescript --config p/react --config p/nextjs --config p/secrets
